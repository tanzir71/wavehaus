name = "wavehaus"
main = "src/index.ts"
compatibility_date = "2026-11-01"
assets = { directory = "../app/dist", binding = "ASSETS", html_handling = "none", not_found_handling = "none", run_worker_first = true }
[[d1_databases]]
binding = "DB"
database_name = "wavehaus"
database_id = "00000000-0000-0000-0000-000000000000" # replace before deploying
migrations_dir = "../migrations"
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "wavehaus-media"
