name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server-worker
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run test:api
      - run: npm run test:journal:demo
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, mbstring, openssl, fileinfo
          coverage: none
      - run: npm run build
      - run: npm run test:media-offload
      - run: npm run test:migrations
      - run: npm run test:migrations:worker
      - run: npm run test:journal
      - run: npm run test:journal:php
      - run: npm run test:php
        env:
          RUN_LARGE_UPLOAD: '1'
      - name: Install optional Apache offload test server
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends apache2 libapache2-mod-xsendfile
      - name: Test authenticated Apache X-Sendfile ranges
        run: npm run test:php
        env:
          TEST_APACHE_OFFLOAD: '1'
      - run: npm run test:worker
        env:
          RUN_LARGE_UPLOAD: '1'
      - run: npm run package
      - run: python tests/package/redeploy.py
      - run: python tests/package/worker-types.py
      - run: npm run build:pages
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
