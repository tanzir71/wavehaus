name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: github.ref_name == 'v0.0.0'
        run: npm run build
      - if: github.ref_name != 'v0.0.0'
        run: npm run package
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_name }}" = "v0.0.0" ]; then
            gh release create "${{ github.ref_name }}" --title "Wavehaus M0 — Your music, at home" --notes-file docs/release-notes.md
          else
            gh release create "${{ github.ref_name }}" dist/*.zip --title "Wavehaus ${{ github.ref_name }}" --notes-file docs/release-notes.md
          fi
